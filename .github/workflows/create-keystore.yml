name: Create release keystore (run once)

# Generates a signing key so that every future build is signed with the SAME key (needed to
# install updates over an existing install). Download the artifact, store its contents as
# repository secrets, then DELETE the artifact. The key is never committed to the repository.
on:
  workflow_dispatch:
    inputs:
      password:
        description: "Keystore/key password (>= 8 chars) - you will store it as a secret"
        required: true

jobs:
  keystore:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse on a public repository
        if: ${{ !github.event.repository.private }}
        run: |
          echo "::error::This repository is public. The password input and the keystore artifact of this run would be visible to others. Create the key on your own computer and add the HDR_KEYSTORE_* secrets by hand."
          exit 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: |
          echo "::add-mask::${{ inputs.password }}"
          keytool -genkeypair -keystore release.jks -storepass "${{ inputs.password }}" -keypass "${{ inputs.password }}" \
            -alias hdrstudio -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=HDR Studio"
          base64 -w0 release.jks > HDR_KEYSTORE_BASE64.txt
          printf 'Secrets to create (Settings > Secrets and variables > Actions):\nHDR_KEYSTORE_BASE64 = contents of HDR_KEYSTORE_BASE64.txt\nHDR_KEYSTORE_PASSWORD = your password\nHDR_KEY_ALIAS = hdrstudio\nHDR_KEY_PASSWORD = your password\nThen delete this artifact.\n' > README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-keystore-DELETE-AFTER-USE
          path: |
            HDR_KEYSTORE_BASE64.txt
            README.txt
          retention-days: 1
