name: PC app tests

on:
  workflow_dispatch:
  push:
    branches: [work/v2.2, main]
    paths: ["pc/**", ".github/workflows/pc-tests.yml"]
  pull_request:
    paths: ["pc/**", ".github/workflows/pc-tests.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pc/requirements*.txt
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      # CPU-only: API security, planning, encoder arguments, HDR10 SEI patching and the
      # ONNX conversions (Real-ESRGAN general against its reference vector, RIFE v4.6).
      # tests/test_export.py (real export, resume after kill) needs a GPU and FFmpeg and is
      # skipped here: run it locally before a release.
      - run: python -m pytest tests -q
