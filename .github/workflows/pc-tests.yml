name: PC app tests

on:
  workflow_dispatch:
  push:
    branches: [work/v2.2, main]
    paths: ["pc/**", ".github/workflows/pc-tests.yml"]
  pull_request:
    paths: ["pc/**", ".github/workflows/pc-tests.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pc/requirements*.txt
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      # CPU-only: API security, planning, encoder arguments, HDR10 SEI patching and the
      # ONNX conversions (Real-ESRGAN general against its reference vector, RIFE v4.6).
      # The GPU pipeline and FFmpeg export are not covered here (no GPU on hosted runners).
      - run: python -m pytest tests -q
