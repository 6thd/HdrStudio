name: Build HDR Studio

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run the desktop shader/AI test harness (slow, ~20 min)"
        type: boolean
        default: false
      verify_model:
        description: "Compare the bundled AI weights with the official Real-ESRGAN release"
        type: boolean
        default: false
      allow_unstable_key:
        description: "Allow a throw-away debug key when the HDR_KEYSTORE_* secrets are missing (the APK will not update an existing install)"
        type: boolean
        default: false
  push:
    # a push to the working branch builds the test APK (artifact only, no release); main kept for later
    branches: [main, work/ncnn-vulkan]
    paths-ignore: ["docs/**", "**/*.md"]

permissions:
  contents: read          # no automatic public releases; APKs are workflow artifacts

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # the JVM tests compile the v2.1 baseline commit for regression proofs
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1"
      - name: ncnn 20250503 android-vulkan (prebuilt static library, checksum pinned)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ncnn.zip" https://github.com/Tencent/ncnn/releases/download/20250503/ncnn-20250503-android-vulkan.zip
          echo "4b54cd11094dae1371c59fb202dfd92d22962ffaef04317bdf99b12c09f44ed3  $RUNNER_TEMP/ncnn.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ncnn.zip" -d "$RUNNER_TEMP"
          D="$RUNNER_TEMP/ncnn-20250503-android-vulkan/arm64-v8a/lib/cmake/ncnn"
          test -f "$D/ncnnConfig.cmake"
          echo "NCNN_DIR=$D" >> "$GITHUB_ENV"
      - name: Restore signing keystore
        env:
          KS_B64: ${{ secrets.HDR_KEYSTORE_BASE64 }}
          ALLOW: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_unstable_key }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "HDR_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing test and release APKs with the stored key (stable: updates install over older builds)."
          elif [ "$ALLOW" = "true" ]; then
            echo "::warning::No HDR_KEYSTORE_BASE64 secret: test APK uses a throw-away debug key; release APK will be unsigned."
          else
            echo "::error::No HDR_KEYSTORE_BASE64 secret. A test build must be signed with the stable key. Add the HDR_KEYSTORE_* secrets, or rerun with allow_unstable_key."
            exit 1
          fi
      - name: JVM unit tests (colour maths, metadata, scene cuts, HEVC bitstream parser)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python3 -m pip install --break-system-packages numpy==2.1.3 || python3 -m pip install numpy==2.1.3
          python3 -c "import numpy; print('numpy', numpy.__version__)"
          tools/jvmtests/run.sh
      - name: Build
        env:
          HDR_KEYSTORE_PASSWORD: ${{ secrets.HDR_KEYSTORE_PASSWORD }}
          HDR_KEY_ALIAS: ${{ secrets.HDR_KEY_ALIAS }}
          HDR_KEY_PASSWORD: ${{ secrets.HDR_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease
      - name: Collect APKs and build record
        env:
          # SHA-256 of the permanent test signing certificate (public; the key itself is in the HDR_KEYSTORE_* secrets)
          TEST_CERT_SHA256: 1ffb4f14c6df8f7e90cfb5efe84a04f6a46a282120d016ac1cb7213ba4b4095a
          ALLOW: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_unstable_key }}
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/HDR-Studio-test.apk
          ls app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/*.apk out/ 2>/dev/null || true
          sha256sum out/*.apk | tee out/SHA256SUMS.txt
          BT="$ANDROID_HOME/build-tools/35.0.0"
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          mkdir -p "$RUNNER_TEMP/apk" && unzip -q -o out/HDR-Studio-test.apk 'lib/*' -d "$RUNNER_TEMP/apk"
          SO="$RUNNER_TEMP/apk/lib/arm64-v8a/libhdrstudio_ncnn.so"
          test -f "$SO" || { echo "::error::libhdrstudio_ncnn.so is missing from the test APK"; exit 1; }
          # the library must be this build's, with the precision-flag JNI; the 2.3.2 binary must never ship again
          SOSHA=$(sha256sum "$SO" | cut -d' ' -f1)
          [ "$SOSHA" != "b7fff38ba92b24620392807c659a82a806814168fe3bc5e7acb873259ef2d736" ] || { echo "::error::the 2.3.2 native library is in the APK"; exit 1; }
          NM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          for f in nativeCreate nativeOptions nativeLayer nativeForward nativeDestroy nativeFullVulkan nativeLastError nativeDevice; do
            "$NM" -D --defined-only "$SO" | grep -q " Java_com_mojahed_hdrstudio_ai_NcnnSr_${f}$" || { echo "::error::JNI symbol $f missing"; exit 1; }
          done
          for f in nativeProbe; do
            if "$NM" -D --defined-only "$SO" | grep -q " Java_com_mojahed_hdrstudio_ai_NcnnSr_${f}$"; then echo "::error::stale JNI symbol $f"; exit 1; fi
          done
          # one permanent test key: the APK must carry exactly this certificate
          CERT=$("$BT/apksigner" verify --print-certs out/HDR-Studio-test.apk | grep -m1 "SHA-256 digest" | awk '{print $NF}')
          if [ "$CERT" != "$TEST_CERT_SHA256" ] && [ "$ALLOW" != "true" ]; then
            echo "::error::test APK certificate $CERT is not the permanent test key $TEST_CERT_SHA256"; exit 1
          fi
          ALIGN=$("$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -lW "$SO" | awk '$1=="LOAD"{print $NF}' | sort -u | tr '\n' ' ')
          {
            echo "HDR Studio $(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)-test (GitHub Actions)"
            echo "git_commit: $GITHUB_SHA"
            echo "ref: $GITHUB_REF_NAME  run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            "$BT/aapt2" dump badging out/HDR-Studio-test.apk | head -1
            "$BT/apksigner" verify --print-certs out/HDR-Studio-test.apk | grep -E "SHA-256|DN" | sed 's/^/signing: /'
            echo "native: $SOSHA  lib/arm64-v8a/libhdrstudio_ncnn.so  built from app/src/main/cpp at this commit"
            echo "permanent test key expected: $TEST_CERT_SHA256  got: $CERT"
            echo "ELF LOAD alignment: $ALIGN"
            echo "ncnn: 20250503 android-vulkan sha256 4b54cd11094dae1371c59fb202dfd92d22962ffaef04317bdf99b12c09f44ed3"
            echo "NDK: 27.2.12479018  CMake: 3.22.1"
            echo "classes.dex: $(unzip -p out/HDR-Studio-test.apk classes.dex | sha256sum | cut -d' ' -f1)"
            cat out/SHA256SUMS.txt
          } | tee out/BUILD_INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: HDR-Studio-apk
          path: out/
          retention-days: 30

  verify-model:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_model }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pip install numpy==2.1.3
      - run: |
          curl -fsSL -o general.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-general-x4v3.pth
          python3 tools/convert_official_pth.py general.pth official.bin app/src/main/assets/models/srvgg_general_x4v3.bin

  tests:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tests }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install numpy==2.1.3 ncnn==1.0.20261020
      - run: |
          cd tools/harness && npm init -y >/dev/null && npm install playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: bash tools/harness/run_ci.sh "$RUNNER_TEMP/hdrtest"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-report
          path: |
            ${{ runner.temp }}/hdrtest/run_*/out/report.json
            ${{ runner.temp }}/hdrtest/run_*/out/jvm_tests.log
            ${{ runner.temp }}/hdrtest/run_*/jvm/jvm_results.txt
            ${{ runner.temp }}/hdrtest/run_*/out/png/
